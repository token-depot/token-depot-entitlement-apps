<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Depot CA Token Explorer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <h1>CA Token Explorer</h1>
      <p>Recover public metadata for KRC-20 issue-mode CA tokens. This app is read-only and does not use wallet keys or signing.</p>
    </header>

    <section class="card">
      <form id="lookupForm" class="form-grid">
        <label>Network
          <select id="network">
            <option value="mainnet" selected>Mainnet</option>
            <option value="tn10">TN10</option>
          </select>
        </label>
        <label>CA
          <input id="caInput" spellcheck="false" value="2d6fc4377f2fb2a5d051e6c99b6d784960b45edc2f6d268bfc432b5ee5dee3dc">
        </label>
        <button id="lookupButton" type="submit">Look up CA</button>
      </form>
      <p id="status" class="status">Ready.</p>
    </section>

    <section id="result" class="card" hidden></section>
    <section id="rawProof" class="card" hidden></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
